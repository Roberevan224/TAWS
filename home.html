<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAWS Home</title><style>body{margin:0;background:#0a0d12;color:#eef2f8;font:16px system-ui,sans-serif;height:100vh;display:grid;place-items:center}.wrap{text-align:center;width:min(760px,90%)}.logo{margin:auto;width:92px;height:92px;border-radius:22px;display:grid;place-items:center;background:#f0f2f5;color:#0a0d12;font-size:34px;font-weight:900}.wrap h1{font-size:46px;margin:20px 0 5px}.wrap p{color:#8d96a6}.search{display:flex;margin:28px 0}.search input{flex:1;padding:15px 20px;border-radius:28px 0 0 28px;border:1px solid #303745;background:#11151d;color:#fff;outline:0}.search button{padding:0 22px;border:0;border-radius:0 28px 28px 0;background:#f0f2f5;color:#0a0d12;font-weight:700}.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.links a{padding:10px 14px;background:#171b24;border-radius:10px;color:#eef2f8;text-decoration:none}</style></head><body><div class="wrap"><div class="logo">TA</div><h1>TAWS</h1><p>Tech Axel Web Surfer</p><form class="search" onsubmit="go(event)"><input id="q" autofocus placeholder="Search the web or enter an address"><button>Search</button></form><div class="links"><a href="https://github.com">GitHub</a><a href="https://www.wikipedia.org">Wikipedia</a><a href="https://www.google.com">Google</a></div></div><script>function go(e){e.preventDefault();const v=q.value.trim();if(v)location.href=/^https?:\/\//i.test(v)?v:/^[\w.-]+\.[a-z]{2,}$/i.test(v)?'https://'+v:'https://www.google.com/search?q='+encodeURIComponent(v)}</script></body></html>
