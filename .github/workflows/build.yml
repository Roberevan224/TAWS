name: Build TAWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Linux packages
        run: npm run dist
      - name: Verify Linux package exists
        run: |
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: taws-linux
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win nsis
      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter *.exe | Format-Table Name,Length
          if (-not (Get-ChildItem -Path dist -Filter *.exe)) { throw 'No Windows EXE was produced.' }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: taws-windows-installer
          path: dist/*.exe
