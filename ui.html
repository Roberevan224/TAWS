<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAWS</title><style>
*{box-sizing:border-box}body{margin:0;background:#10131a;color:#eef2f8;font:14px system-ui,sans-serif;overflow:hidden}.bar{height:58px;display:flex;align-items:center;gap:7px;padding:8px 10px;background:#151922;border-bottom:1px solid #2a303b}.brand{display:flex;align-items:center;gap:8px;font-weight:800;min-width:100px}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#f0f2f5;color:#10131a;font-size:12px;font-weight:900}.btn{width:36px;height:36px;border:0;border-radius:8px;background:#1d222d;color:#e8ecf2;font-size:20px;cursor:pointer}.btn:hover{background:#29303d}.addr{flex:1;height:38px;border:1px solid #343b49;border-radius:20px;background:#0c0f15;color:#f4f6fa;padding:0 16px;outline:0}.addr:focus{border-color:#69758b}.tabs{height:40px;display:flex;gap:4px;align-items:end;padding:0 10px;background:#0d1016}.tab{height:34px;min-width:140px;max-width:230px;padding:0 10px;border-radius:8px 8px 0 0;background:#171b24;display:flex;align-items:center;gap:8px;cursor:pointer}.tab.active{background:#292f3a}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.x{border:0;background:transparent;color:#9ba4b3;font-size:16px}.new{height:30px;width:30px;border:0;border-radius:7px;background:#171b24;color:#fff;font-size:18px;margin-bottom:2px;cursor:pointer}</style></head><body>
<div class="bar"><div class="brand"><div class="logo">TA</div><span>TAWS</span></div><button class="btn" id="back">‹</button><button class="btn" id="forward">›</button><button class="btn" id="reload">↻</button><input class="addr" id="addr" placeholder="Search or enter web address" autocomplete="off"><button class="btn" id="home">⌂</button><button class="btn" id="vault">🔑</button></div>
<div class="tabs" id="tabs"><button class="new" id="new">＋</button></div>
<script>
const api=window.taws;let active=null,tabs=new Map();const $=x=>document.getElementById(x);
function norm(x){x=(x||'').trim();if(!x)return'https://www.google.com';if(/^[a-z][a-z0-9+.-]*:\/\//i.test(x))return x;if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(x))return'https://'+x;return'https://www.google.com/search?q='+encodeURIComponent(x)}
function render(){document.querySelectorAll('.tab').forEach(e=>e.remove());const n=$('new');for(const [id,t] of tabs){const e=document.createElement('div');e.className='tab'+(id===active?' active':'');e.dataset.id=id;e.innerHTML='<span>'+esc(t.title||'New Tab')+'</span><button class="x">×</button>';e.onclick=ev=>{if(ev.target.className==='x'){api.closeTab(id);tabs.delete(id);if(active===id)active=[...tabs.keys()][0]||null;render();return}active=id;api.activate(id);render();};n.before(e)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('addr').onkeydown=e=>{if(e.key==='Enter'&&active!==null)api.navigate(active,e.target.value)};$('new').onclick=()=>api.newTab();$('back').onclick=()=>active!==null&&api.back(active);$('forward').onclick=()=>active!==null&&api.forward(active);$('reload').onclick=()=>active!==null&&api.reload(active);$('home').onclick=()=>active!==null&&api.navigate(active,'https://www.google.com');
window.addEventListener('taws:tab-created',e=>{tabs.set(e.detail.id,{title:'New Tab',url:e.detail.url});active=e.detail.id;render()});window.addEventListener('taws:active',e=>{active=e.detail.id;render()});window.addEventListener('taws:navigation',e=>{const t=tabs.get(e.detail.id);if(t){t.url=e.detail.url;t.title=e.detail.title||new URL(e.detail.url).hostname}if(e.detail.id===active)$('addr').value=e.detail.url;render()});window.addEventListener('taws:title',e=>{const t=tabs.get(e.detail.id);if(t)t.title=e.detail.title;render()});
</script></body></html>
